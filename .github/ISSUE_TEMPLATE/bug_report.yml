name: Bug report
description: planlens shows something wrong, crashes, or won't read a plan
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan JSON that shows the problem
      description: A small `terraform show -json` excerpt is the fastest way to a fix. Remove real secrets, account IDs and hostnames first.
      render: json
  - type: input
    id: version
    attributes:
      label: planlens version
      description: Output of `planlens --version`
    validations:
      required: true
  - type: input
    id: terraform
    attributes:
      label: Terraform or OpenTofu version
      description: Output of `terraform version` or `tofu version`
  - type: input
    id: env
    attributes:
      label: Operating system, Node.js version and browser
      placeholder: macOS 26, Node 24.4, Chrome 154
